name: "condo"
namespace: "methods"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    label: "Dataset"
    summary: "Unintegrated AnnData HDF5 file."
    info:
      format:
        type: "h5ad"
        layers:
        - type: "integer"
          name: "counts"
          description: "Raw counts"
          required: true
        - type: "double"
          name: "normalized"
          description: "Normalized expression values"
          required: true
        obs:
        - type: "string"
          name: "cell_type"
          description: "Cell type information"
          required: true
        - type: "string"
          name: "batch"
          description: "Batch information"
          required: true
        var:
        - type: "boolean"
          name: "hvg"
          description: "Whether or not the feature is considered to be a 'highly variable\
            \ gene'"
          required: true
        - type: "double"
          name: "hvg_score"
          description: "A ranking of the features by hvg."
          required: true
        - type: "string"
          name: "feature_name"
          description: "A human-readable name for the feature, usually a gene symbol."
          required: true
        - type: "string"
          name: "feature_id"
          description: "A database identifier for the feature, usually an ENSEMBL\
            \ ID."
          required: true
        obsm:
        - type: "double"
          name: "X_pca"
          description: "The resulting PCA embedding."
          required: true
        obsp:
        - type: "double"
          name: "knn_distances"
          description: "K nearest neighbors distance matrix."
          required: true
        - type: "double"
          name: "knn_connectivities"
          description: "K nearest neighbors connectivities matrix."
          required: true
        uns:
        - type: "string"
          name: "dataset_id"
          description: "A unique identifier for the dataset"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Which normalization was used"
          required: true
        - name: "dataset_organism"
          type: "string"
          description: "The organism of the sample in the dataset."
          required: false
        - type: "object"
          name: "knn"
          description: "Supplementary K nearest neighbors data."
          required: true
    example:
    - "resources_test/task_batch_integration/cxg_immune_cell_atlas/dataset.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    label: "Integration"
    summary: "An integrated AnnData dataset."
    description: "Must contain at least one of:\n\n  - Feature: the corrected_counts\
      \ layer\n  - Embedding: the X_emb obsm\n  - Graph: the connectivities and distances\
      \ obsp\n"
    info:
      format:
        type: "h5ad"
        layers:
        - type: "double"
          name: "corrected_counts"
          description: "Feature output - corrected counts"
          required: false
        obsm:
        - type: "double"
          name: "X_emb"
          description: "Embedding output - 2D coordinate matrix"
          required: false
        obsp:
        - type: "double"
          name: "connectivities"
          description: "Graph output - neighbor connectivities matrix"
          required: false
        - type: "double"
          name: "distances"
          description: "Graph output - neighbor distances matrix"
          required: false
        uns:
        - type: "string"
          name: "dataset_id"
          description: "A unique identifier for the dataset"
          required: true
        - type: "string"
          name: "normalization_id"
          description: "Which normalization was used"
          required: true
        - name: "dataset_organism"
          type: "string"
          description: "The organism of the sample in the dataset."
          required: false
        - type: "string"
          name: "method_id"
          description: "A unique identifier for the method"
          required: true
        - type: "object"
          name: "neighbors"
          description: "Supplementary K nearest neighbors data."
          required: false
    example:
    - "resources_test/task_batch_integration/cxg_immune_cell_atlas/integrated.h5ad"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--transform_type"
    description: "Type of linear transformation to apply."
    info: null
    default:
    - "location-scale"
    required: false
    choices:
    - "location-scale"
    - "affine"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--rep"
    description: "Representation to fit on. 'features' fits on the normalized expression\n\
      matrix and writes corrected_counts (feature method). 'pca' fits on\nobsm['X_pca']\
      \ and writes obsm['X_emb'] (embedding output).\n"
    info: null
    default:
    - "features"
    required: false
    choices:
    - "features"
    - "pca"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--hvg_only"
    description: "Restrict the feature-space fit to var['hvg'] columns; pass through\n\
      non-HVG genes at the source's normalized value. Only applies when\n--rep=features.\n"
    info: null
    default:
    - false
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--bootstrap_fraction"
    description: "Optional random subsample of data for constrained memory settings."
    info: null
    default:
    - 1.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_epochs"
    description: "Number of epochs to run."
    info: null
    default:
    - 5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--learning_rate"
    description: "Learning rate."
    info: null
    default:
    - 0.001
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--mmd_size"
    description: "Number of samples used in each MMD evaluation (K_X in the paper)."
    info: null
    default:
    - 40
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--batch_size"
    description: "Number of MMD-loss evaluations per gradient step (K_Z in the paper)."
    info: null
    default:
    - 8
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--weight_decay"
    description: "AdamW weight decay applied to all model parameters (matrix/scale\
      \ and\nbias/location).\n"
    info: null
    default:
    - 1.0E-5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--patience"
    description: "Early-stopping patience (epochs without train-loss improvement\n\
      before stopping).\n"
    info: null
    default:
    - 3
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--random_state"
    description: "Random seed for the adapter."
    info: null
    default:
    - 42
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--device"
    description: "Torch device for the MMD training loop. Use 'cuda' or e.g. 'cuda:0'\n\
      to run on GPU. Numpy preprocessing stays on CPU regardless.\n"
    info: null
    default:
    - "cpu"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "condo_runner.py"
- type: "file"
  path: "read_anndata_partial.py"
label: "ConDo"
summary: "ConDo is a feature transformation method for batch correction based on matching\
  \ conditional distributions."
description: "Confounded Domain Adaptation (ConDo) is a batch correction method that\n\
  performs a linear transformation of the features to match their\nconditional distribution\
  \ given biological variables of interest. The\nintegrator walks a compatibility\
  \ graph (batches sharing at least one\ncell type are connected), seeding at the\
  \ batch with the highest\npre-integration silhouette of cell_type, and iteratively\
  \ merges each\nbest-scoring neighbour by fitting one ConDo adapter conditioned on\n\
  cell_type. Batches in disconnected components are passed through.\n"
test_resources:
- type: "python_script"
  path: "check_config.py"
  is_executable: true
- type: "python_script"
  path: "run_and_check_output.py"
  is_executable: true
- type: "file"
  path: "resources_test/task_batch_integration/cxg_immune_cell_atlas"
  dest: "resources_test/task_batch_integration/cxg_immune_cell_atlas"
info:
  method_types:
  - "feature"
  preferred_normalization: "log_cp10k"
  variants:
    condo_mmd_affine:
      transform_type: "affine"
      weight_decay: 1.0e-4
    condo_mmd_location_scale:
      transform_type: "location-scale"
      weight_decay: 1.0e-5
  type: "method"
  type_info:
    label: "Method"
    summary: "A method for the batch integration task."
    description: "A batch integration method which integrates multiple datasets.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
license: "MIT"
references:
  doi:
  - "10.5281/zenodo.17066563"
links:
  repository: "https://github.com/calvinmccarter/condo-adapter"
  docker_registry: "ghcr.io"
  documentation: "https://github.com/calvinmccarter/condo-adapter?tab=readme-ov-file#usage"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "midtime"
    - "midmem"
    - "midcpu"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_pytorch_nvidia:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    pypi:
    - "condo==1.1.0"
    - "miceforest==5.7.0"
    - "numpy<2"
    - "pandas"
    - "pytorch-minimize==0.0.2"
    - "scib"
    - "scikit-learn"
    - "scipy>=1.6"
    - "torch>=2.12.0"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/methods/condo/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker"
  output: "target/nextflow/methods/condo"
  executable: "target/nextflow/methods/condo/main.nf"
  viash_version: "0.9.4"
  git_commit: "9187c604ba4642ac3d50333811351be02728f531"
  git_remote: "https://github.com/openproblems-bio/task_batch_integration"
package_config:
  name: "task_batch_integration"
  version: "build_main"
  label: "Batch Integration"
  summary: "Remove unwanted batch effects from scRNA-seq data while retaining biologically\
    \ meaningful variation."
  description: "As single-cell technologies advance, single-cell datasets are growing\
    \ both in size and complexity.\nEspecially in consortia such as the Human Cell\
    \ Atlas, individual studies combine data from multiple labs, each sequencing multiple\
    \ individuals possibly with different technologies.\nThis gives rise to complex\
    \ batch effects in the data that must be computationally removed to perform a\
    \ joint analysis.\nThese batch integration methods must remove the batch effect\
    \ while not removing relevant biological information.\nCurrently, over 200 tools\
    \ exist that aim to remove batch effects scRNA-seq datasets [@zappia2018exploring].\n\
    These methods balance the removal of batch effects with the conservation of nuanced\
    \ biological information in different ways.\nThis abundance of tools has complicated\
    \ batch integration method choice, leading to several benchmarks on this topic\
    \ [@luecken2022benchmarking; @tran2020benchmark; @chazarragil2021flexible; @mereu2020benchmarking].\n\
    Yet, benchmarks use different metrics, method implementations and datasets. Here\
    \ we build a living benchmarking task for batch integration methods with the vision\
    \ of improving the consistency of method evaluation.\n\nIn this task we evaluate\
    \ batch integration methods on their ability to remove batch effects in the data\
    \ while conserving variation attributed to biological effects.\nAs input, methods\
    \ require either normalised or unnormalised data with multiple batches and consistent\
    \ cell type labels.\nThe batch integrated output can be a feature matrix, a low\
    \ dimensional embedding and/or a neighbourhood graph.\nThe respective batch-integrated\
    \ representation is then evaluated using sets of metrics that capture how well\
    \ batch effects are removed and whether biological variance is conserved.\nWe\
    \ have based this particular task on the latest, and most extensive benchmark\
    \ of single-cell data integration methods.\n"
  info:
    image: "thumbnail.svg"
    test_resources:
    - type: "s3"
      path: "s3://openproblems-data/resources_test/common/cxg_immune_cell_atlas/"
      dest: "resources_test/common/cxg_immune_cell_atlas"
    - type: "s3"
      path: "s3://openproblems-data/resources_test/task_batch_integration/"
      dest: "resources_test/task_batch_integration"
  repositories:
  - type: "github"
    name: "openproblems"
    repo: "openproblems-bio/openproblems"
    tag: "build/main"
  viash_version: "0.9.4"
  source: "src"
  target: "target"
  config_mods:
  - ".runners[.type == \"nextflow\"].config.labels := { lowmem : \"memory = 20.Gb\"\
    , midmem : \"memory = 50.Gb\", highmem : \"memory = 100.Gb\", lowcpu : \"cpus\
    \ = 5\", midcpu : \"cpus = 15\", highcpu : \"cpus = 30\", lowtime : \"time = 1.h\"\
    , midtime : \"time = 4.h\", hightime : \"time = 8.h\", veryhightime : \"time =\
    \ 24.h\" }\n"
