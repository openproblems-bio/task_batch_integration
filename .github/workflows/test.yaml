name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    uses: viash-io/viash-actions/.github/workflows/test.yaml@v6

  scgpt_training_parameters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: >-
          python -B -m unittest discover
          -s src/methods/scgpt_finetuned -p test_training_params.py -v
